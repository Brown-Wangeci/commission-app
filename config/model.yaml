# Modelling configuration: evaluation design, models, resampling and decision bands.
#
# Moved out of config/generator.yaml so that generator parameters and
# modelling parameters cannot be confused for one another. Source tags follow
# the same convention as generator.yaml: spec (explicitly stated by the
# supervisor), literature, industry partner, assumption.
#
# Nothing in this file is tuned toward a target metric.

# Repeated cross-validation, grouped by agent and ordered by time. In every
# fold, test agents never appear in training, every test row is on or after the
# test start date, and every training row's T7 window (generator
# features.t7_window_days) has closed before the test start. The single
# holdout split used in Phase 2 is withdrawn: 70 test agents is too few to
# report from.
cross_validation:
  n_folds: 5  # controls: agent groups per repeat; each group is the test set once. source: spec (Phase 2 supervisor review)
  n_repeats: 3  # controls: how many times the agent grouping is redrawn, so fold-to-fold spread reflects which agents land together, not one lucky partition. source: assumption
  cv_seed: 7  # controls: agent-to-fold assignment, inner validation assignment and hyperparameter candidates. source: spec (that the seed is fixed); the value 7 itself is arbitrary
  test_start_fraction: 0.5  # controls: position in the simulated period where the test period starts. Rationale: equal halves give both sides six complete payout cycles, so training sees every cycle phase several times and each fold's test score averages over several cycles rather than one campaign. source: assumption
  inner_validation_agent_fraction: 0.25  # controls: share of outer-training agents held out as the inner validation fold for hyperparameter search. source: assumption
  inner_validation_start_fraction: 0.6  # controls: position within the usable outer-training period where the inner validation period starts; inner training rows must have closed their T7 window before it. source: assumption
  calibration_agent_fraction: 0.25  # controls: share of each fold's training agents held out of the model fit so a calibrator can be fitted on scores the model has not seen. The model therefore trains on fewer rows than in Phase 4, which is the price of honest calibration. source: assumption

reporting:
  precision_targets: [0.90, 0.95]  # controls: precision levels at which recall is reported. Metric definitions only, not decision thresholds. source: spec (Phase 2 supervisor review)

# From Phase 5, seed 42 is no longer the headline. Every reported number is a
# mean across these seeds with the seed-level spread; fold-level variation is
# secondary and understates uncertainty, because StratifiedGroupKFold orders
# groups by size so fold 0 always carries the heaviest agents.
multi_seed:
  seeds: [7, 42, 101, 2024]  # controls: the seeds every headline number averages over. source: spec (Phase 4 supervisor review)
  n_repeats: 1  # controls: agent groupings per seed. One, because seed-level spread is now the primary uncertainty and four seeds at five folds costs what one seed at fifteen folds did. source: assumption
  models:  # controls: the models trained per seed and fold. source: assumption
    - {name: "t7_none", feature_set: "t7", method: "none"}  # the chosen model from Phase 5: no resampling, no weighting
    - {name: "t0_none", feature_set: "t0", method: "none"}  # same treatment at T0, for the auto-release comparison
    - {name: "t7_smote", feature_set: "t7", method: "smote"}  # the pre-registered Phase 3 choice, kept so the deviation is visible
  chosen_model: "t7_none"  # controls: which model the calibration, band, SHAP and fairness work uses. Chosen because the matched-strength sweep put every method within 0.004 PR-AUC of every other against a fold sd of 0.037, with no handling highest. source: spec (Phase 4 supervisor review)
  t0_model: "t0_none"  # controls: the T0 counterpart used in the auto-release comparison. source: assumption
  preregistered_model: "t7_smote"  # controls: the model reported alongside the chosen one so the deviation from the pre-registered choice is explicit. source: spec (Phase 4 supervisor review)

# Probability calibration. The chosen model's raw scores are not probabilities
# and the decision bands are probability cutoffs, so the bands are set on
# calibrated output. The calibrator is fitted on agents held out of the model
# fit, inside the training window, and never on test data.
calibration:
  methods: ["isotonic", "sigmoid"]  # controls: calibration methods compared. "sigmoid" is Platt scaling. source: spec (Phase 4 supervisor review)
  ece_bins: 15  # controls: equal-count bins used for expected calibration error. source: assumption
  reliability_bins: 12  # controls: equal-count bins used for the reliability curves. source: assumption

# Two-dimensional band sweep. Candidate thresholds are quantiles of the pooled
# calibrated scores rather than a uniform grid, because calibrated fraud
# probabilities pile up near zero and a uniform grid would spend its resolution
# where no activations sit.
explanations:
  shap_rows_per_fold: 1500  # controls: test rows sampled per fold for SHAP. Enough for stable mean absolute values without storing every row of every fold. source: assumption
  worked_case_features: 4  # controls: how many features appear in an admin-facing reason string. source: assumption

bands:
  sweep_quantiles: 240 # controls: candidate thresholds per axis, taken as quantiles of the calibrated score. source: assumption
  min_band_probability: 0.0005  # controls: floor on candidate thresholds, so the sweep does not chase single rows in the far tail. source: assumption

investigations:
  latency_tail_cut_hours: [1, 2, 3, 6, 12]  # controls: job acceptance latency cut points at which src.eval.investigations reports how much of each class and typology sits in the tail. Reporting only. source: assumption
  permutation_shuffles: 5  # controls: label shuffles per fold in the permutation control, so its null spread is visible rather than a single draw. Reporting only. source: assumption
  isolation_forest_trees: 200  # controls: size of the label-free Isolation Forest used to measure how much signal is plain outlyingness. Reporting only. source: assumption (scikit-learn default is 100)
  lookalike_audit_tail_mass: 0.25  # controls: share of a typology's rows defining the tail region the lookalike audit examines; a quarter is large enough that the region is the typology's characteristic behaviour rather than its extreme outliers. Reporting only. source: assumption
  chosen_imbalance_method: "smote"  # controls: which XGBoost variant the Phase 4 analyses treat as the chosen model. Set from the Phase 3 paired comparison and revisited by the matched-ratio sweep. source: assumption
  ablation_feature_sets: ["t7", "t7_no_agent_history"]  # controls: feature sets compared in the agent-versus-activation ablation. The ablation drops tenure, both velocity windows, device counts and distinct devices from the chosen model's feature set. The full t7 set is rerun here rather than reused so the two rows come from one identical procedure; because the seeds match, it also reproduces the main run's t7 numbers as a consistency check. source: spec (Phase 3 supervisor review listed the features to remove)
  realisation_control:  # controls: the matched control that separates the effect of a generator fix from the effect of getting a different random dataset. The same fixed model runs over the first repeat's folds for each seed, under the pre-fix and post-fix generators. source: assumption
    label: "postfix"  # controls: name of the generator version in the output file; set to "prefix" when running against the Phase 3 snapshot. source: assumption
    seeds: [42, 7, 101]  # controls: seeds whose spread estimates realisation noise. source: assumption
    candidate: {n_estimators: 400, max_depth: 5, learning_rate: 0.05, min_child_weight: 5, subsample: 0.8, colsample_bytree: 0.8, reg_lambda: 1.0}  # controls: one fixed hyperparameter set, mid-range in the search space, so no search variance enters the control. source: assumption
  collusion_probe: {n_estimators: 200, max_depth: 3, learning_rate: 0.05}  # controls: the small fixed model used only to ask whether collusion is separable from legitimate trial-lapse rows at all. Not a reported model, not searched. Reporting only. source: assumption
  overlap_histogram_bins: 40 # controls: bins used for the histogram-intersection overlap coefficient in the collusion check. Reporting only. source: assumption
  lookalike_audit_flag_share: 0.01 # controls: a signature is flagged when under this share of legitimate rows falls in that region. Reporting only. source: spec (Phase 3 supervisor review: "a counterpart under 1% of legitimate rows")

# Hand-written analyst rules. Not fitted: each threshold is a round number
# written from the typology descriptions in docs/data_dictionary.md section 6,
# without looking at how any feature is distributed by class. An activation's
# score is the number of rules it triggers.
rules_baseline:
  - name: volume_burst_dead_customer  # source: assumption
    description: "Agent submitted five or more activations in 24 hours and the customer was active on at most one day of the week."
    conditions:
      - {feature: agent_activation_velocity_24h, op: ">=", value: 5}
      - {feature: customer_active_days_7d, op: "<=", value: 1}
  - name: shared_device_fresh_sim  # source: assumption
    description: "Device used by three or more agents in 30 days, activating a SIM registered within the last two days."
    conditions:
      - {feature: device_shared_agent_count_30d, op: ">=", value: 3}
      - {feature: sim_age_at_activation_days, op: "<=", value: 2}
  - name: keyed_in_no_proof_no_use  # source: assumption
    description: "Keyed in by hand, no proof attached, and not one customer transaction in the week."
    conditions:
      - {feature: activation_method_is_manual_entry, op: "==", value: 1}
      - {feature: proof_of_activation_missing_flag, op: "==", value: 1}
      - {feature: transaction_count_7d, op: "==", value: 0}
  - name: held_job_released_at_cutoff  # source: assumption
    description: "Job left unaccepted for more than two hours, then submitted within a day of a payout cutoff."
    conditions:
      - {feature: job_acceptance_latency_seconds, op: ">=", value: 7200}
      - {feature: days_to_payout_cutoff, op: "<=", value: 1}

logistic_regression:
  C: 1.0  # controls: inverse regularisation strength, after standard scaling. source: assumption (scikit-learn default)
  max_iter: 2000  # controls: solver iteration cap; a convergence limit, not a model choice. source: assumption

xgboost:
  search_iterations: 12  # controls: random hyperparameter candidates scored on the inner validation fold. source: assumption
  tree_method: "hist"  # controls: tree construction algorithm. source: assumption
  n_jobs: -1  # controls: CPU threads per fit (-1 means all). source: assumption
  search_space:  # controls: ranges the random search draws from; the same candidates are scored for every XGBoost variant within a fold. source: assumption
    n_estimators: {dist: discrete, values: [200, 400, 700], weights: [1, 1, 1]}
    max_depth: {dist: discrete, values: [3, 4, 5, 6, 8], weights: [1, 1, 1, 1, 1]}
    learning_rate: {dist: loguniform, low: 0.02, high: 0.2}
    min_child_weight: {dist: discrete, values: [1, 3, 5, 10], weights: [1, 1, 1, 1]}
    subsample: {dist: uniform, low: 0.6, high: 1.0}
    colsample_bytree: {dist: uniform, low: 0.5, high: 1.0}
    reg_lambda: {dist: loguniform, low: 0.5, high: 10.0}

# Class imbalance, compared for XGBoost. SMOTE is applied to the training
# split only, after splitting, and inside the inner search to the inner
# training rows only. scale_pos_weight has no parameter: it is the
# negative-to-positive ratio of whichever training split is being fitted.
resampling:
  smote_k_neighbors: 5  # controls: number of neighbours used by SMOTE. source: assumption (imbalanced-learn default)
  target_minority_ratio: 0.30  # controls: minority-to-majority ratio after SMOTE. source: assumption
  sweep:  # controls: the matched-strength comparison (src.train.resampling_sweep). Every method is run at every ratio, so method and strength are separated. source: spec (Phase 3 supervisor review asked for at least three ratios for both methods)
    methods: ["smote", "smotenc", "scale_pos_weight", "none"]  # controls: SMOTE interpolates binary flags to fractions; SMOTE-NC copies them from the neighbourhood majority instead; scale_pos_weight reweights without generating rows; "none" leaves the training split untouched at its natural ratio, as the floor of the strength axis. source: assumption
    minority_ratios: [0.10, 0.20, 0.30, 0.50, 1.00]  # controls: effective minority-to-majority ratios swept. 0.30 is the Phase 3 SMOTE setting and 1.00 is the Phase 3 scale_pos_weight setting (full balance), so both earlier configurations appear in the sweep. source: assumption

# Superseded in Phase 5: the bands are no longer assumed. They are optimised
# against config/costs.yaml on calibrated probabilities, under the review
# capacity constraint, by src.eval.bands. The chosen operating point is written
# to outputs/band_operating_point.csv rather than being fixed here, so that it
# cannot be quietly detached from the cost matrix that produced it. The two
# values below are kept only as the Phase 2 starting point for comparison.
decision_bands:
  auto_release_threshold: 0.20  # controls: nothing now. The Phase 2 assumed cutoff, retained for comparison against the optimised point. source: assumption
  reject_threshold: 0.80  # controls: nothing now. The Phase 2 assumed cutoff, retained for comparison. source: assumption

# Auto-release measurement (Part C). Auto-release lives in the high-purity
# region, so it is measured by the purity of the released set, not by an
# average over all thresholds.
auto_release:
  released_precision_targets: [0.95, 0.99]  # controls: required share of the auto-released set that is genuinely legitimate. source: spec (Phase 4 supervisor review)
